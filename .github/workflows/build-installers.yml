name: Build OS Installers

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installers:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: Calculator-Linux.deb
          - os: windows-latest
            artifact_name: Calculator-Windows-Setup.exe
          - os: macos-latest
            artifact_name: Calculator-macOS.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14" 

      - name: Install PyInstaller and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r src/requirements.txt

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "Calculator" src/gui.py

      # ==========================================
      # LINUX: Create a .deb package
      # ==========================================
      - name: Create Linux .deb installer
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y rubygems
          sudo gem install fpm
          
          VER=$(cat VERSION | tr -d '\n\r ')
          
          mkdir -p package_root/usr/local/bin
          cp dist/Calculator package_root/usr/local/bin/
          
          fpm -s dir -t deb -n "calculator" -v "$VER" -C package_root .
          
          mv calculator_${VER}_amd64.deb Calculator-Linux.deb

      # ==========================================
      # WINDOWS: Create a Setup Installer
      # ==========================================
      - name: Create Windows Setup Installer (Inno Setup)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          VER=$(cat VERSION | tr -d '\n\r ')
          
          echo '[Setup]' > installer.iss
          echo 'AppName=Calculator' >> installer.iss
          echo "AppVersion=$VER" >> installer.iss
          echo 'DefaultDirName={autopf}\Calculator' >> installer.iss
          echo 'OutputDir=.' >> installer.iss
          echo 'OutputBaseFilename=Calculator-Windows-Setup' >> installer.iss
          echo 'Compression=lzma' >> installer.iss
          echo 'SolidCompression=yes' >> installer.iss
          echo '[Files]' >> installer.iss
          echo 'Source: "dist\Calculator.exe"; DestDir: "{app}"; Flags: ignoreversion' >> installer.iss
          echo '[Icons]' >> installer.iss
          echo 'Name: "{autoprograms}\Calculator"; Filename: "{app}\Calculator.exe"' >> installer.iss

          iscc installer.iss

      # ==========================================
      # MACOS: Create a .dmg image
      # ==========================================
      - name: Create macOS .dmg installer
        if: matrix.os == 'macos-latest'
        run: |
          brew install create-dmg
          VER=$(cat VERSION | tr -d '\n\r ')
          
          create-dmg \
            --volname "Calculator v$VER Installer" \
            --window-pos 200 120 \
            --window-size 600 300 \
            --icon-size 100 \
            --app-drop-link 425 120 \
            "Calculator-macOS.dmg" \
            "dist/Calculator.app"

      # ==========================================
      # UPLOAD ARTIFACTS
      # ==========================================
      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  # ==========================================
  # NEW JOB: Create Release if VERSION changed
  # ==========================================
  create-release:
    name: Create GitHub Release
    needs: build-installers
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if VERSION file changed
        id: check_version
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "^VERSION$"; then
            echo "changed=true" >> $GITHUB_OUTPUT
            VER=$(cat VERSION | tr -d '\n\r ')
            echo "version=$VER" >> $GITHUB_OUTPUT
            echo "Version changed to $VER! Preparing release."
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "VERSION file did not change. Skipping release."
          fi

      - name: Download all OS artifacts
        if: steps.check_version.outputs.changed == 'true'
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Create Release and Upload Assets
        if: steps.check_version.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.check_version.outputs.version }}
          name: Release v${{ steps.check_version.outputs.version }}
          generate_release_notes: true
          files: release_assets/*
